name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Libraries (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "./packages/**" typecheck

      - run: pnpm --filter "./packages/**" build

      - run: pnpm --filter "./packages/**" test

  quality:
    name: Lint, coverage & package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:coverage

      - run: pnpm build

      - run: pnpm verify:packages

  dotnet:
    name: Build (ASP.NET Core example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - run: dotnet build examples/api

      - run: dotnet test examples/api.tests

  e2e:
    name: E2E (Node → API → EF Core → SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter tanstack-aspnet-data build

      - run: dotnet build examples/api -c Release

      - name: Start API in background
        run: |
          dotnet run --project examples/api -c Release --no-build &
          echo $! > /tmp/api.pid
        env:
          DataLoading__MaxTake: 100

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5055/health > /dev/null; then
              echo "API up after ${i} attempt(s)"
              break
            fi
            sleep 2
            if [ "$i" = 60 ]; then
              echo "API did not start in time"
              exit 1
            fi
          done

      - name: Run live scenarios
        run: node examples/e2e/live.mjs
        env:
          E2E_API_URL: http://localhost:5055/api/products
          E2E_MAX_TAKE: 100

      - name: Stop API
        if: always()
        run: kill $(cat /tmp/api.pid) || true
